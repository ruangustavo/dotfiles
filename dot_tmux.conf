# History deep enough that scrollback survives reattach
set -g history-limit 100000

# Mouse on (terminal-side scroll falls through to tmux copy-mode)
set -g mouse on

# Faster command sequences
set -s escape-time 0

# Don't shrink to smallest attached client
setw -g aggressive-resize on

# Sane index
set -g base-index 1
setw -g pane-base-index 1

# Reload conf binding
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
